<!doctype html><html lang="{{ page.lang | default: 'en' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#8a005d"><meta name="description" content="{{ page.description | default: site.description | escape }}"><title>{{ page.title | default: site.title }}{% unless page.title contains 'Magic Fox' %} — Magic Fox{% endunless %}</title><link rel="icon" href="{{ '/assets/images/logo.png' | relative_url }}"><link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}"></head><body>
